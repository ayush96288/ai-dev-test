

name: Daily AI Project Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Ask AI to audit the project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import urllib.request
          import urllib.error
          from pathlib import Path

          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("Missing GEMINI_API_KEY secret.")

          readme = Path("README.md")
          description = (
              readme.read_text(encoding="utf-8")[:6000]
              if readme.exists()
              else "No README.md found."
          )

          prompt = f"""
          You are my software project auditor.

          Review this project description:
          {description}

          Write a report covering:
          1. What the project appears to do.
          2. Three useful improvements.
          3. Potential risks or missing information.
          4. What should be tested next.

          Be specific and honest.
          Do not claim you ran tests.
          Do not modify files.
          End with only one next priority.
          """

          payload = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 800
              }
          }

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.8-flash:"
              "streamGenerateContent?alt=sse"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key
              },
              method="POST"
          )

          report_parts = []

          try:
              print("Connecting to Gemini API...")

              with urllib.request.urlopen(
                  request, timeout=90
              ) as response:
                  for raw_line in response:
                      line = raw_line.decode(
                          "utf-8", errors="replace"
                      ).strip()

                      if not line.startswith("data:"):
                          continue

                      event_text = line[5:].strip()

                      if not event_text or event_text == "[DONE]":
                          continue

                      try:
                          event = json.loads(event_text)
                      except json.JSONDecodeError:
                          continue

                      for candidate in event.get("candidates", []):
                          content = candidate.get("content", {})
                          for part in content.get("parts", []):
                              text = part.get("text", "")
                              if text:
                                  report_parts.append(text)

          except urllib.error.HTTPError as error:
              details = error.read().decode(
                  "utf-8", errors="replace"
              )
              print(f"Gemini API returned HTTP {error.code}.")
              print(details[:2000])
              raise SystemExit(1)

          except (TimeoutError, socket.timeout):
              raise SystemExit(
                  "Gemini timed out after 90 seconds. "
                  "Check the model name, API access and service status."
              )

          except urllib.error.URLError as error:
              raise SystemExit(
                  f"Could not connect to Gemini: {error.reason}"
              )

          report = "".join(report_parts).strip()

          if not report:
              raise SystemExit(
                  "Gemini returned no report text. "
                  "Check the model name, API access and quota."
              )

          print("\nDAILY AI PROJECT REPORT\n")
          print(report)
          PY
